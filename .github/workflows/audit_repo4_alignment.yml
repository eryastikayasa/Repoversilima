name: Audit Repo5 Against Repo4

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo5
        uses: actions/checkout@v4

      - name: Checkout Repo4 reference
        uses: actions/checkout@v4
        with:
          repository: eryastikayasa/Repoversiempat
          path: repo4

      - name: Compare proven base components
        shell: bash
        run: |
          set -euo pipefail
          for d in wifi_manager uart_control web_config display; do
            diff -ru --exclude='.git' "repo4/components/$d" "components/$d"
          done
          echo "PASS: WiFi/UART/WebConfig/Display match Repo4"

      - name: Audit WakeWord reference configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'espressif/esp-sr:' main/idf_component.yml
          grep -q 'version: "2.4.5"' main/idf_component.yml
          grep -q 'CONFIG_SR_WN_WN9_HIESP=y' sdkconfig.defaults
          grep -q 'CONFIG_SR_NSN_NSNET2=y' sdkconfig.defaults
          grep -q 'model, *data' partitions/partitions.csv
          grep -q '0x400000' partitions/partitions.csv
          grep -q 'wn9_hiesp' components/wakeword/wakeword.cpp
          grep -q 'esp_srmodel_init("model")' components/wakeword/wakeword.cpp
          grep -q 'esp_wn_handle_from_name' components/wakeword/wakeword.cpp
          grep -q 'DET_MODE_90' components/wakeword/wakeword.cpp
          grep -q 'detect' components/wakeword/wakeword.cpp
          echo "PASS: WakeWord configuration/reference checks"

      - name: Audit Audio HAL isolation
        shell: bash
        run: |
          set -euo pipefail
          test -f components/audio_hal/audio_hal.cpp
          test -f components/audio_hal/include/audio_hal.h
          test -f components/audio_hal/CMakeLists.txt
          if grep -RniE 'websocket|gemini|base64|cJSON|wakeword|nsnet|aec|session|wifi' components/audio_hal; then
            echo 'FAIL: Audio HAL contains upper-layer/AI logic'
            exit 1
          fi
          echo "PASS: Audio HAL is isolated"

      - name: Audit minimal app entry point
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'extern "C" void app_main' main/main.cpp
          echo "PASS: app_main exists"

      - name: Build Repo5
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.1
          target: esp32s3
          path: '.'
          command: idf.py build

      - name: Audit build configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f build/project_description.json
          grep -Rni 'ESP32-S3' build/project_description.json || true
          echo "PASS: build completed"
