name: Build ESP32-S3 Firmware

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync Display from Repo4
        if: ${{ !contains(github.event.head_commit.message, 'sync display from Repo4') }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/repo4"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/eryastikayasa/Repoversiempat.git "$RUNNER_TEMP/repo4"
          git -C "$RUNNER_TEMP/repo4" sparse-checkout set components/display
          rm -rf components/display
          cp -a "$RUNNER_TEMP/repo4/components/display" components/display
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/display
          if git diff --cached --quiet; then
            echo "Display already matches Repo4"
          else
            git commit -m "display: sync display from Repo4"
            git push origin HEAD:main
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run

      - name: Download ESP-SR v2.4.5 WakeNet model
        run: |
          set -euo pipefail
          ESP_SR_COMMIT="5fadfbd5bd9df756f543973bd43520d9270ffb1b"
          SRC_DIR="$RUNNER_TEMP/esp-sr-v2.4.5"
          rm -rf "$SRC_DIR"
          mkdir -p "$SRC_DIR"
          cd "$SRC_DIR"
          git init
          git remote add origin https://github.com/espressif/esp-sr.git
          git config core.sparseCheckout true
          git sparse-checkout set model/wakenet_model/wn9_hiesp
          git fetch --depth 1 origin "$ESP_SR_COMMIT"
          git checkout --detach FETCH_HEAD
          test -s "$SRC_DIR/model/wakenet_model/wn9_hiesp/wn9_index"
          test -s "$SRC_DIR/model/wakenet_model/wn9_hiesp/wn9_data"

      - name: Pack WakeNet model image
        run: |
          set -euo pipefail
          BUILD="$PWD/.pio/build/esp32-s3-devkitc-1"
          MODEL_DIR="$BUILD/srmodels"
          rm -rf "$MODEL_DIR"
          mkdir -p "$MODEL_DIR"
          cp -a "$RUNNER_TEMP/esp-sr-v2.4.5/model/wakenet_model/wn9_hiesp" "$MODEL_DIR/"
          python scripts/pack_model.py -m "$MODEL_DIR" -o "$MODEL_DIR/srmodels.bin"
          test -s "$MODEL_DIR/srmodels.bin"
          grep -a -q "wn9_hiesp" "$MODEL_DIR/srmodels.bin"
          test "$(stat -c %s "$MODEL_DIR/srmodels.bin")" -le $((0x400000))

      - name: Upload firmware and WakeNet model
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-firmware-wakeword
          if-no-files-found: error
          path: |
            .pio/build/esp32-s3-devkitc-1/firmware.bin
            .pio/build/esp32-s3-devkitc-1/bootloader.bin
            .pio/build/esp32-s3-devkitc-1/partitions.bin
            .pio/build/esp32-s3-devkitc-1/firmware.elf
            .pio/build/esp32-s3-devkitc-1/srmodels/srmodels.bin
